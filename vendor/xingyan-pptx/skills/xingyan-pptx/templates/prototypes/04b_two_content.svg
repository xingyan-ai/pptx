<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="zt_content_master" data-pptx-master-name="Zhongtai Content"
  data-pptx-layout="two-content" data-pptx-layout-name="Two Content">
  
  <g id="chapter-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="204 22 72 48">
    <text id="chapter-slot-carrier" data-pptx-carrier="true" x="204" y="54"
      fill="#B20017" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="32" font-weight="700">{{CHAPTER}}</text>
  </g>
  <g id="content-title-slot" data-pptx-placeholder="title" data-pptx-bounds="284 22 860 48">
    <text id="content-title-slot-carrier" data-pptx-carrier="true" x="284" y="54"
      fill="#000000" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="32" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="left-slot" data-pptx-placeholder="object" data-pptx-idx="2" data-pptx-bounds="67 139 540 400">
    <text id="left-slot-carrier" data-pptx-carrier="true" x="67" y="160"
      fill="#000000" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400">{{LEFT_TEXT}}</text>
  </g>
  <g id="right-slot" data-pptx-placeholder="object" data-pptx-idx="3" data-pptx-bounds="639 139 573 400">
    <text id="right-slot-carrier" data-pptx-carrier="true" x="639" y="160"
      fill="#000000" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400">{{RIGHT_VISUAL}}</text>
  </g>
  <g id="content-page-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4" data-pptx-bounds="1180 651 40 32">
    <text id="content-page-slot-carrier" data-pptx-carrier="true" x="1220" y="672" text-anchor="end"
      fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400">{{PAGE_NUM}}</text>
  </g>
</svg>
