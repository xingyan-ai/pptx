<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="zt_content_master" data-pptx-master-name="Zhongtai Content"
  data-pptx-layout="section" data-pptx-layout-name="Section Header">
  
  <rect id="section-rule" x="100" y="356" width="72" height="4" fill="#B20017" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="section-number-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 244 420 124">
    <text id="section-number-slot-carrier" data-pptx-carrier="true" x="100" y="330"
      fill="#B20017" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="96" font-weight="700">{{SECTION_NO}}</text>
  </g>
  <g id="section-title-slot" data-pptx-placeholder="title" data-pptx-bounds="100 388 1000 62">
    <text id="section-title-slot-carrier" data-pptx-carrier="true" x="100" y="430"
      fill="#000000" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="44" font-weight="700">{{SECTION_TITLE}}</text>
  </g>
  <g id="section-sub-slot" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="100 459 900 32">
    <text id="section-sub-slot-carrier" data-pptx-carrier="true" x="100" y="480"
      fill="#595959" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400">{{SECTION_SUB}}</text>
  </g>
  <g id="content-page-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4" data-pptx-bounds="1180 651 40 32">
    <text id="content-page-slot-carrier" data-pptx-carrier="true" x="1220" y="672" text-anchor="end"
      fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400">{{PAGE_NUM}}</text>
  </g>
</svg>
